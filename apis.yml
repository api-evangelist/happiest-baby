aid: happiest-baby
name: Happiest Baby
description: 'Happiest Baby is a consumer sleep-technology company founded by pediatrician
  Dr. Harvey Karp, best known for the SNOO Smart Sleeper - an FDA-authorized responsive
  bassinet that uses sensor-driven motion and white noise to soothe infants and improve
  sleep. The company also sells the Sleepea swaddle and sleep sacks, runs a companion
  mobile app with parenting guidance, and operates a healthcare/hospital program. Its
  connected SNOO hardware communicates in real time over PubNub; Happiest Baby publishes
  no official public developer API, and the only programmatic access is via community-built
  wrappers around the undocumented mobile-app API. Backed by GV and Obvious Ventures.'
